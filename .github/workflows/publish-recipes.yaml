# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Publish Recipes

on:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  # Main, releases, and retries share one writer for the mutable aliases.
  group: publish-recipes
  queue: max

env:
  RAD_CLI_URL: https://raw.githubusercontent.com/radius-project/radius/main/deploy/install.sh

jobs:
  publish-dev:
    name: Publish Recipes to GHCR - Dev
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Verify ORAS installation
        run: oras version

      - name: Download rad CLI
        run: |
          echo "Downloading latest rad CLI"
          wget -q "${{ env.RAD_CLI_URL }}" -O - | /bin/bash -s edge

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Recipes to GHCR
        # Uses REL_VERSION as the recipe version so PR builds result in a `pr-<pr number>` tag
        run: ./.github/scripts/publish-recipes.sh radius-project dev/recipes ${{ env.REL_VERSION }}

  delete-dev:
    name: Delete GHCR recipes - Dev
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    needs: publish-dev
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Recipes from GHCR
        # Uses REL_VERSION as the recipe version so PR builds result in a `pr-<pr number>` tag
        run: ./.github/scripts/delete-recipes.sh radius-project dev/recipes ${{ env.REL_VERSION }}

  # This is where we can add integration tests in the future

  publish-public:
    if: github.event_name != 'pull_request'
    name: Publish Recipes to GHCR - Public
    runs-on: ubuntu-latest
    environment:
      name: Public
    permissions:
      contents: read
      packages: write
    outputs:
      subjects: ${{ steps.subjects.outputs.checksums }}
      version: ${{ steps.subjects.outputs.version }}
      channel: ${{ steps.subjects.outputs.channel }}
      stable: ${{ steps.subjects.outputs.stable }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse release version and set environment variables
        run: python ./.github/scripts/get_release_version.py

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Verify ORAS installation
        run: oras version

      - name: Download rad CLI
        run: |
          echo "Downloading latest rad CLI"
          wget -q "${{ env.RAD_CLI_URL }}" -O - | /bin/bash -s edge

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Recipes to GHCR
        env:
          # Release tags record each published digest for the attestation job.
          RECIPE_SUBJECTS_FILE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/recipe-subjects.txt', runner.temp) || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$REL_TAG"
          if [[ "$tag" == edge ]]; then
            current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid main commit." >&2; exit 1; }
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "Publishing only the source pin; this main commit was superseded."
              tag="$GITHUB_SHA"
            fi
          fi
          ./.github/scripts/publish-recipes.sh radius-project recipes "$tag"

      - name: Record published recipe digests
        id: subjects
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "version=$REL_VERSION"
            echo "channel=$REL_CHANNEL"
            echo "stable=$UPDATE_RELEASE"
            echo 'checksums<<EOF'
            sort -u "${RUNNER_TEMP}/recipe-subjects.txt"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

  # Signing runs in its own job, so neither the downloaded CLI nor Bicep can
  # request the OIDC token used to sign the release provenance.
  attest-public:
    name: Attest Recipes - Public
    needs: publish-public
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Required to sign the provenance with Sigstore
      attestations: write # Required to store the provenance attestation
    steps:
      - name: Write attestation subjects
        env:
          SUBJECTS: ${{ needs.publish-public.outputs.subjects }}
        run: |
          if [[ -z "${SUBJECTS}" ]]; then
            echo "No published recipe digests were recorded." >&2
            exit 1
          fi
          printf '%s\n' "${SUBJECTS}" > "${RUNNER_TEMP}/recipe-subjects.txt"

      - name: Attest published recipe provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/recipe-subjects.txt

  promote-public:
    name: Promote stable recipe aliases
    needs: [publish-public, attest-public]
    if: needs.publish-public.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified recipe digests
        env:
          RELEASE_VERSION: ${{ needs.publish-public.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.publish-public.outputs.channel }}
          SUBJECTS: ${{ needs.publish-public.outputs.subjects }}
        run: |
          printf '%s\n' "$SUBJECTS" >"$RUNNER_TEMP/recipe-subjects.txt"
          bash .github/scripts/recipe-oci.sh promote "$RELEASE_VERSION" \
            "$RUNNER_TEMP/recipe-subjects.txt" "$RELEASE_CHANNEL"
